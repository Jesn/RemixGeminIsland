<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GeminIsland</title>
    <meta
      name="description"
      content="共享的阳光 3D 体素小岛，任何人都可以创作动态体素作品并一起实时探索。"
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Apple Messages / WhatsApp / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GeminIsland" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="GeminIsland" />
    <meta
      property="og:description"
      content="共享的阳光 3D 体素小岛，任何人都可以创作动态体素作品并一起实时探索。"
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GeminIsland" />
    <meta
      name="twitter:description"
      content="共享的阳光 3D 体素小岛，任何人都可以创作动态体素作品并一起实时探索。"
    />

    <!-- Apple Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GeminIsland" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Endless Animated Sunlit Grass Voxel Canvas -->
    <canvas id="world-canvas" aria-label="共享的动态 3D 体素草地世界"></canvas>

    <!-- Camera Controls (Desktop + Mobile: Pan / Orbit / Walk + Recentre) -->
    <div id="cam-controls" class="cam-controls" role="toolbar" aria-label="视角控制">
      <div class="cam-mode-group island-switch-group" role="group" aria-label="岛屿切换">
        <button
          type="button"
          id="island-main-btn"
          class="cam-mode-btn is-active"
          aria-pressed="true"
          title="切换至主岛"
        >
          <span>主岛</span>
        </button>
        <button
          type="button"
          id="island-bagua-btn"
          class="cam-mode-btn"
          aria-pressed="false"
          title="切换至东侧八卦城海岛"
        >
          <span>八卦城</span>
        </button>
        <button
          type="button"
          id="island-kunlun-btn"
          class="cam-mode-btn"
          aria-pressed="false"
          title="切换至北侧蓬莱玄霜仙岛"
        >
          <span>蓬莱雪岛</span>
        </button>
      </div>

      <div class="cam-mode-group" role="group" aria-label="视角模式">
        <button
          type="button"
          id="cam-pan-btn"
          class="cam-mode-btn is-active"
          aria-pressed="true"
          title="移动视角"
        >
          <svg class="cam-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" />
          </svg>
          <span>平移</span>
        </button>
        <button
          type="button"
          id="cam-orbit-btn"
          class="cam-mode-btn"
          aria-pressed="false"
          title="旋转和倾斜视角"
        >
          <svg class="cam-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
          <span>旋转</span>
        </button>
        <button
          type="button"
          id="cam-walk-btn"
          class="cam-mode-btn"
          aria-pressed="false"
          title="第一人称漫步"
        >
          <svg class="cam-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="4.5" r="2" />
            <path d="M8.5 20.5L10.8 14l3.2 2.8.6 3.7" />
            <path d="M10.8 14l1-5.2" />
            <path d="M7.5 12.4l3.8-3.4 3.4 1 2.3 2.2" />
          </svg>
          <span>漫步</span>
        </button>
        <button
          type="button"
          id="cam-panorama-btn"
          class="cam-mode-btn"
          aria-pressed="false"
          title="高空全景俯瞰八卦城全岛"
        >
          <svg class="cam-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="12 2 19 6 22 12 19 18 12 22 5 18 2 12 5 6 12 2" />
            <circle cx="12" cy="12" r="3.2" />
          </svg>
          <span>全景模式</span>
        </button>
      </div>

      <button
        type="button"
        id="recenter-btn"
        class="cam-recenter-btn"
        aria-label="回正视角"
        title="回正视角"
      >
        <svg class="cam-icon cam-compass-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.35" />
          <g id="recenter-compass">
            <polygon points="12,4.2 14.7,12 9.3,12" fill="#d94e43" />
            <polygon points="12,19.8 14.7,12 9.3,12" fill="currentColor" fill-opacity="0.55" />
          </g>
        </svg>
        <span>回正</span>
      </button>

      <button
        type="button"
        id="atmosphere-btn"
        class="cam-recenter-btn cam-atmosphere-btn"
        aria-pressed="false"
        aria-label="切换晴昼或暮色华灯氛围"
        title="切换晴昼 / 暮色华灯"
      >
        <svg class="cam-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        <span id="atmosphere-label">晴昼</span>
      </button>

      <button
        type="button"
        id="avatar-btn"
        class="cam-recenter-btn cam-avatar-btn"
        aria-label="自定义角色"
        title="自定义角色"
      >
        <svg class="cam-icon cam-avatar-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="7.5" y="3.5" width="9" height="8" rx="2" />
          <path d="M5.5 20.5v-2.2a3.8 3.8 0 0 1 3.8-3.8h5.4a3.8 3.8 0 0 1 3.8 3.8v2.2" />
        </svg>
        <span class="avatar-swatch-dot" id="avatar-swatch-dot" aria-hidden="true"></span>
        <span>角色</span>
      </button>

      <div id="online-pill" class="online-pill" title="当前在线玩家" hidden>
        <span class="live-dot" aria-hidden="true"></span>
        <span id="online-count">1</span>
      </div>
    </div>

    <!-- Hover nameplate + optional live API readout -->
    <div id="hover-card" class="hover-card" hidden>
      <div id="hover-name" class="hover-name"></div>
      <div id="hover-feed" class="hover-feed" hidden></div>
      <div id="hover-status" class="hover-status"></div>
    </div>

    <!-- Folded Space Teleport Distortion Overlay -->
    <div id="space-fold-overlay" class="space-fold-overlay" aria-hidden="true" hidden></div>

    <!-- Floating Bagua Directional Energy D3 Visualization HUD -->
    <aside id="bagua-energy-hud" class="bagua-energy-hud" aria-label="八卦灵脉能量监测" hidden></aside>

    <!-- Transient world note -->
    <div id="weave-toast" class="weave-toast" role="status" aria-live="polite" hidden></div>

    <!-- Mobile First-Person Walk Joystick (forward/back + strafe) -->
    <div id="walk-joystick" class="walk-joystick" aria-label="漫步移动摇杆" hidden>
      <svg class="walk-joystick-svg" viewBox="-64 -64 128 128" fill="none" aria-hidden="true">
        <circle cx="0" cy="0" r="55" stroke="#161b18" stroke-opacity="0.1" stroke-width="1.2" />
        <polyline id="walk-joy-up" class="walk-joy-chevron" points="-7,-41 0,-49 7,-41" />
        <polyline id="walk-joy-down" class="walk-joy-chevron" points="-7,41 0,49 7,41" />
        <polyline id="walk-joy-left" class="walk-joy-chevron" points="-41,-7 -49,0 -41,7" />
        <polyline id="walk-joy-right" class="walk-joy-chevron" points="41,-7 49,0 41,7" />
        <g id="walk-joystick-knob" transform="translate(0 0)">
          <circle cx="0" cy="3" r="22" fill="#0f1c12" fill-opacity="0.22" />
          <circle cx="0" cy="0" r="21.5" fill="#ffffff" stroke="#161b18" stroke-opacity="0.18" stroke-width="1.5" />
          <circle cx="0" cy="0" r="7.5" fill="#161b18" fill-opacity="0.07" stroke="#161b18" stroke-opacity="0.22" stroke-width="1.4" />
        </g>
      </svg>
    </div>

    <!-- Subtle First-Person Exit Hint (Desktop Walk Mode) -->
    <button type="button" id="walk-esc-hint" class="walk-esc-hint" aria-label="按 Esc 键退出第一人称视角" hidden>
      <kbd class="walk-esc-key">Esc</kbd><span>退出视角</span>
    </button>

    <!-- Contextual First-Person Interaction Prompt -->
    <button type="button" id="interact-prompt" class="interact-prompt" hidden>
      <kbd id="interact-key" class="interact-key">E</kbd><span id="interact-label">进入</span>
    </button>

    <!-- Bottom-Anchored Explore & Build Dock (never blocks the 3D meadow) -->
    <div class="bottom-dock">
      <!-- 1. Explore-first single Add button -->
      <button type="button" id="add-btn" class="dock-pill dock-pill-add">
        + 添加
      </button>

      <!-- 2. Spot-picking prompt pill -->
      <div id="pick-spot-pill" class="dock-pill dock-pill-pick" hidden>
        <span>点击选择放置位置</span>
        <button type="button" id="cancel-pick-btn" class="icon-close-btn" aria-label="取消选择位置">
          &times;
        </button>
      </div>

      <!-- 3. Compact bottom building box -->
      <section id="bottom-builder" class="bottom-builder" aria-label="添加作品" hidden>
        <div class="builder-bar">
          <button type="button" id="move-spot-btn" class="spot-chip-btn">更换位置</button>
          <button type="button" id="close-builder-btn" class="icon-close-btn" aria-label="关闭">
            &times;
          </button>
        </div>

        <div class="builder-row">
          <label id="drop-zone" class="drop-tile" for="image-input" title="上传图片">
            <input id="image-input" type="file" accept="image/*" hidden />
            <div id="drop-empty" class="drop-tile-empty">
              <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="3" />
                <circle cx="8.5" cy="9.5" r="1.5" />
                <path d="M21 15l-4.5-4.5L9 18" />
              </svg>
              <span>图片</span>
            </div>
            <div id="drop-preview-wrap" class="drop-preview-wrap" hidden>
              <img id="drop-preview-img" alt="已选择的参考图片" />
              <button type="button" id="clear-image-btn" class="clear-img-btn" aria-label="移除图片">
                &times;
              </button>
            </div>
          </label>

          <textarea
            id="prompt-input"
            rows="2"
            maxlength="480"
            placeholder="描述你想添加的内容…"
            aria-label="描述你想添加的内容"
          ></textarea>
        </div>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <p class="upload-disclaimer">
          使用此功能即表示您确认对所上传的任何内容拥有必要权利。请勿生成侵犯他人知识产权或隐私权的内容。您对本生成式 AI 服务的使用须遵守我们的<a href="https://policies.google.com/terms/generative-ai/use-policy" target="_blank" rel="noopener noreferrer">《禁止使用政策》</a>。请注意，包括来自 Google Workspace 的上传内容在内，均可能按照我们的<a href="https://aistudio.google.com/docs/terms?e=0" target="_blank" rel="noopener noreferrer">《服务条款》</a>用于开发和改进 Google 产品与服务。
        </p>

        <button type="button" id="sculpt-btn" class="primary-btn">开始建造</button>
      </section>

      <!-- 4. Building in background pill -->
      <div id="building-pill" class="dock-pill dock-pill-building" role="status" aria-live="polite" hidden>
        <span class="pill-spinner" aria-hidden="true"></span>
        <span class="building-pill-copy">
          <span id="building-pill-label" class="building-pill-title">正在审核创意…</span>
          <span id="building-pill-sub" class="building-pill-sub">正在使用 Gemini 4 Hydrogen 构建</span>
        </span>
      </div>

      <!-- 5. Ready -> Click to fly camera to it -->
      <button type="button" id="ready-goto-btn" class="dock-pill dock-pill-ready" hidden>
        <span class="live-dot live-dot-pulse" aria-hidden="true"></span>
        <span id="ready-goto-label">已就绪 · 前往查看</span>
      </button>

      <!-- 6. Locate existing creation -->
      <button type="button" id="locate-mine-btn" class="dock-pill dock-pill-placed" hidden>
        <span class="live-dot" aria-hidden="true"></span>
        <span id="locate-mine-label">定位我的作品</span>
      </button>
    </div>

    <dialog id="avatar-dialog" class="avatar-dialog" closedby="any" aria-label="自定义角色"></dialog>

    <script type="module" src="/client/app.js"></script>
  </body>
</html>
